name: Project validation
on:
  push:
  pull_request:
jobs:
  lint-and-test:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Install validation tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y shellcheck xorriso qemu-utils
      - name: Shell syntax and smoke checks
        run: bash tests/smoke.sh
      - name: ShellCheck
        run: |
          shellcheck scripts/*.sh guest/*.sh tests/smoke.sh
